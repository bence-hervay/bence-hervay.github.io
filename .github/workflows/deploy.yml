name: Deploy site

on:
  push:
    branches:
      - main
      - "pix/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # GitHub Pages would otherwise run Jekyll a second time over the built output.
      - name: Stop Pages rebuilding the built site 🛑
        run: touch _site/.nojekyll
      - name: Check the routes that must exist 🔍
        run: |
          set -e
          for f in index.html cv/index.html cv.pdf projects/index.html apps/index.html contact/index.html blog/index.html blog/2026/embedding-things/index.html CNAME .nojekyll; do
            test -e "_site/$f" || { echo "MISSING: _site/$f"; exit 1; }
          done
          file _site/cv.pdf | grep -qi pdf || { echo "cv.pdf is not a PDF"; exit 1; }
          echo "All required routes present."
      # The Cambridge address must not reappear in anything we publish. cv.pdf
      # is a binary PDF, not published output text, so it is exempt from the
      # grep the same way it always has been.
      - name: Check no retired email address is published 🔍
        run: |
          if grep -rIl --exclude=cv.pdf 'bh525@cantab' _site; then
            echo "Retired email address found in the built site."; exit 1
          fi
          echo "Retired email address absent from the built site."
      # Only main publishes. Other branches build and run the checks below, so a
      # change can be validated without touching the live site.
      - name: Deploy 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

